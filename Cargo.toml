[workspace]
resolver = "2"
members = [
    "proxychains",
    "proxychains-bin",
    "libproxychains",
    "proxychains-injector",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["tianrking"]
license = "GPL-2.0"
repository = "https://github.com/tianrking/proxychains-rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.dependencies]
libc = "0.2"
nix = { version = "0.28", features = ["net", "socket", "poll", "signal", "process", "fs"] }
ctor = "0.2"
once_cell = "1.19"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "1.0"
anyhow = "1.0"
socket2 = { version = "0.5", features = ["all"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
