name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --workspace --all-targets

  test-and-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rustfmt/clippy
        run: rustup component add rustfmt clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (Windows advisory)
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: cargo clippy --locked --workspace --all-targets

      - name: Run tests
        env:
          RUST_BACKTRACE: 1
        run: cargo test --locked --workspace --all-targets

      - name: Build native injection fixtures
        run: cargo build --locked --workspace --examples

      - name: Build native hook libraries
        run: cargo build --locked --workspace

      - name: Verify Windows injection and TCP routing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PROXYCHAINS_TEST_DLL = "$pwd/target/debug/proxychains.dll"
          $env:PROXYCHAINS_TEST_FIXTURE = "$pwd/target/debug/examples/injection_fixture.exe"
          cargo test --locked -p proxychains-injector --test native_readiness -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p proxychains-injector --test native_udp -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Unix preload and TCP routing
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export PROXYCHAINS_TEST_FIXTURE="$PWD/target/debug/examples/injection_fixture"
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PROXYCHAINS_TEST_DLL="$PWD/target/debug/libproxychains.dylib"
          else
            export PROXYCHAINS_TEST_DLL="$PWD/target/debug/libproxychains.so"
          fi
          cargo test --locked -p proxychains-injector --test native_preload -- --ignored
          cargo test --locked -p proxychains-injector --test native_udp -- --ignored

      - name: Build release binaries
        run: cargo build --locked --release --workspace

      - name: Build macOS release fixture
        if: runner.os == 'macOS'
        run: cargo build --locked --release -p proxychains-injector --examples

      - name: Verify macOS release injection, UDP and HTTP/3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export PROXYCHAINS_TEST_FIXTURE="$PWD/target/release/examples/injection_fixture"
          export PROXYCHAINS_TEST_DLL="$PWD/target/release/libproxychains.dylib"
          cargo test --locked -p proxychains-injector --test native_preload --test native_udp -- --ignored
